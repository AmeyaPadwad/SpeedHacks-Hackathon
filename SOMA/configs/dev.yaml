# SOMA development config. Everything personal is opt-in (see soma/consent.py).
device: auto
model:
  d_model: 256
  n_heads: 8
  image_size: 448
  patch_size: 32
  vision_backbone: scratch
  temporal_kind: gru
capture:
  min_interval_s: 1.0
  persist_screenshots: false
memory:
  db_path: data/soma_memory.sqlite
  index_path: data/soma_index.npz
  top_k: 8
policy:
  relevance_threshold: 0.55
  cooldown_s: 30

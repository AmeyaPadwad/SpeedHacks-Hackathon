# Offline ranker training on synthetic / consented data only.
device: auto
model:
  d_model: 128
  n_heads: 4
  image_size: 224
  patch_size: 32
  vision_layers: 1
  text_layers: 1
  fusion_layers: 1
train:
  seed: 0
  batch_size: 32
  epochs: 8
  lr: 0.0003
  weight_decay: 0.01
  grad_clip: 1.0
  val_fraction: 0.2
  lambda_retrieval: 0.0
  checkpoint_dir: checkpoints
  max_forgetting: 0.02

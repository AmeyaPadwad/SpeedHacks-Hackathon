[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soma"
version = "0.1.0"
description = "SOMA: Screen-Observing Memory and Action. A local-first, PyTorch-first desktop companion."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
  "pyyaml>=6",
  "pillow>=10",
]

[project.optional-dependencies]
capture = ["mss>=9"]
ui = ["PySide6>=6.6"]
ocr = ["rapidocr-onnxruntime"]
vision = ["torchvision>=0.17", "timm>=0.9"]
dev = ["pytest>=8", "hypothesis>=6"]

[tool.setuptools.packages.find]
include = ["soma*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
